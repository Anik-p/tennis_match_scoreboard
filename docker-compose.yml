services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS}
      MYSQL_DATABASE: ${MYSQL_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m30s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -c 'from src.main import app_start; app_start()'"
volumes:
  mysql_data: